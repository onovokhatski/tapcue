name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # End to end: the real server and web app in Chromium, WebKit (Safari's engine) and Firefox
      # (e2e/, spec NFR-1). The browsers are fetched with their system libraries on every run;
      # they are not cached.
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:e2e

  # `npm start` on the platforms a stand computer runs (spec NFR-6): it builds the web app, starts
  # the server, prints the editor URL, and serves the editor on the same port.
  start:
    name: start (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: npm start serves the editor
        run: |
          npm start -- --port 4500 > start.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:4500/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4500/edit/pages | grep -q '<div id="root">'
          # The URLs are printed just after the server starts listening.
          for i in $(seq 1 10); do
            grep -q 'Editor:  http://' start.log && break
            sleep 1
          done
          grep -q 'Editor:  http://' start.log
      - name: Show the start output
        if: always()
        run: cat start.log

  # The click-to-run app (ADR 0017): Tapcue.app on macOS and Tapcue.exe on Windows, built, started
  # with Node.js off the PATH, and kept as a download (the release attaches these zips).
  app:
    name: app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run package:app -w @tapcue/server
      - name: The app starts without Node.js
        run: |
          mkdir -p apphome
          if [ "$RUNNER_OS" = macOS ]; then
            APP=packages/server/dist/app/Tapcue.app/Contents/MacOS/Tapcue
            PROFILE="$PWD/apphome"
          else
            APP=packages/server/dist/app/Tapcue/Tapcue.exe
            PROFILE="$(cygpath -w "$PWD/apphome")"
          fi
          # Only system folders on its PATH: the app must not need Node.js.
          PATH=/usr/bin:/bin:/c/Windows/System32 HOME="$PWD/apphome" USERPROFILE="$PROFILE" \
            TAPCUE_NO_BROWSER=1 "$APP" --port 4600 > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4600/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4600/edit/pages | grep -q '<div id="root">'
          test -f apphome/Documents/Tapcue/demo-stand/project.json
      - name: Show the app output
        if: always()
        run: cat app.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: Tapcue-${{ runner.os }}
          path: packages/server/dist/app/Tapcue-*.zip
          if-no-files-found: error
