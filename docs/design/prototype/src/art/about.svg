<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1536" width="2048" height="1536">
  <!-- Sample designer artwork: About us, poster frame of a looping video (dark). Not Tapcue UI. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c2a2f"/><stop offset="1" stop-color="#061317"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>
  <rect width="2048" height="1536" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity=".8">
    <ellipse cx="560" cy="420" rx="520" ry="160" fill="#2f8f86" transform="rotate(-18 560 420)"/>
    <ellipse cx="1500" cy="1080" rx="600" ry="180" fill="#d18a3a" transform="rotate(-12 1500 1080)" opacity=".7"/>
    <ellipse cx="1300" cy="380" rx="340" ry="120" fill="#7fd1c0" opacity=".5"/>
  </g>
  <rect x="120" y="176" width="236" height="88" rx="44" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".4" stroke-width="3"/>
  <text x="238" y="232" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="600" fill="#e8f5f2">← Home</text>
  <text x="1024" y="760" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="128" fill="#ffffff">Made for small rooms.</text>
  <text x="1024" y="850" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="38" fill="#bfe3dc">Designed and tuned in Lisbon since 2009.</text>
</svg>
