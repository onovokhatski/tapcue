<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1536" width="2048" height="1536">
  <!-- Sample designer artwork: Home (light). Not Tapcue UI. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#faf6ef"/><stop offset="1" stop-color="#e9dfcd"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#5a4320" flood-opacity=".14"/></filter>
    <pattern id="grille" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="3" fill="#000" opacity=".18"/></pattern>
  </defs>
  <rect width="2048" height="1536" fill="url(#bg)"/>
  <circle cx="1760" cy="220" r="560" fill="#f3e8d5"/>
  <circle cx="120" cy="1500" r="380" fill="#efe4d0"/>
  <!-- brand -->
  <circle cx="168" cy="206" r="24" fill="#1f4e5a"/><circle cx="168" cy="206" r="10" fill="#faf6ef"/>
  <text x="210" y="222" font-family="Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="10" fill="#1f2a2e">AUREL</text>
  <!-- call our team (crosses the 16:10 Fill crop line at y=128) -->
  <rect x="1592" y="76" width="312" height="96" rx="48" fill="#1f4e5a"/>
  <circle cx="1644" cy="124" r="10" fill="#7fd1c0"/>
  <text x="1670" y="136" font-family="Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="600" fill="#ffffff">Call our team</text>
  <!-- headline -->
  <text x="144" y="370" font-family="Georgia, 'Times New Roman', serif" font-size="108" fill="#1f2a2e">Find your sound.</text>
  <text x="148" y="438" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" fill="#6b5f50">Tap a product to see it on the big screen.</text>
  <!-- cards -->
  <g filter="url(#sh)">
    <rect x="144" y="500" width="560" height="720" rx="40" fill="#ffffff"/>
    <rect x="744" y="500" width="560" height="720" rx="40" fill="#ffffff"/>
    <rect x="1344" y="500" width="560" height="720" rx="40" fill="#ffffff"/>
  </g>
  <rect x="176" y="532" width="496" height="440" rx="24" fill="#f1ebe1"/>
  <rect x="776" y="532" width="496" height="440" rx="24" fill="#e2eced"/>
  <rect x="1376" y="532" width="496" height="440" rx="24" fill="#f5e3dc"/>
  <!-- A: studio monitor -->
  <g transform="translate(424 752)">
    <ellipse cx="0" cy="176" rx="130" ry="16" fill="#000" opacity=".12"/>
    <rect x="-110" y="-170" width="220" height="340" rx="22" fill="#2a2a2d"/>
    <rect x="-110" y="-170" width="220" height="340" rx="22" fill="none" stroke="#45454a" stroke-width="4"/>
    <circle cx="0" cy="-88" r="36" fill="#121214" stroke="#3b3b40" stroke-width="8"/><circle cx="0" cy="-88" r="12" fill="#2e2e33"/>
    <circle cx="0" cy="58" r="84" fill="#121214" stroke="#3b3b40" stroke-width="10"/><circle cx="0" cy="58" r="30" fill="#26262a"/>
    <circle cx="82" cy="148" r="6" fill="#f5b342"/>
  </g>
  <!-- B: headphones -->
  <g transform="translate(1024 752)">
    <ellipse cx="0" cy="176" rx="150" ry="16" fill="#000" opacity=".1"/>
    <path d="M-120 40 V-10 A120 130 0 0 1 120 -10 V40" fill="none" stroke="#24505d" stroke-width="28" stroke-linecap="round"/>
    <rect x="-168" y="10" width="86" height="150" rx="40" fill="#3a7486"/><rect x="-150" y="30" width="40" height="110" rx="20" fill="#2c5e6d"/>
    <rect x="82" y="10" width="86" height="150" rx="40" fill="#3a7486"/><rect x="110" y="30" width="40" height="110" rx="20" fill="#2c5e6d"/>
  </g>
  <!-- C: portable speaker -->
  <g transform="translate(1624 752)">
    <ellipse cx="0" cy="176" rx="120" ry="16" fill="#000" opacity=".12"/>
    <path d="M-50 -150 Q0 -210 50 -150" fill="none" stroke="#7a3324" stroke-width="16" stroke-linecap="round"/>
    <rect x="-96" y="-150" width="192" height="320" rx="96" fill="#c4573f"/>
    <rect x="-80" y="-110" width="160" height="230" rx="70" fill="url(#grille)"/>
    <circle cx="0" cy="140" r="10" fill="#f6d8cf"/>
  </g>
  <!-- card copy -->
  <g font-family="Helvetica Neue, Arial, sans-serif">
    <text x="184" y="1056" font-size="48" font-weight="700" fill="#1f2a2e">Product A</text>
    <text x="184" y="1104" font-size="30" fill="#6b5f50">Studio monitor</text>
    <text x="184" y="1180" font-size="30" font-weight="600" fill="#1f4e5a">Explore →</text>
    <text x="784" y="1056" font-size="48" font-weight="700" fill="#1f2a2e">Product B</text>
    <text x="784" y="1104" font-size="30" fill="#6b5f50">Wireless headphones</text>
    <text x="784" y="1180" font-size="30" font-weight="600" fill="#1f4e5a">Explore →</text>
    <text x="1384" y="1056" font-size="48" font-weight="700" fill="#1f2a2e">Product C</text>
    <text x="1384" y="1104" font-size="30" fill="#6b5f50">Portable speaker</text>
    <text x="1384" y="1180" font-size="30" font-weight="600" fill="#1f4e5a">Play on the big screen ▸</text>
  </g>
  <!-- footer + about -->
  <text x="148" y="1330" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" fill="#8a7d6b">Hall 4 · Stand B12</text>
  <circle cx="1832" cy="1316" r="72" fill="#ffffff" stroke="#1f4e5a" stroke-width="4"/>
  <text x="1832" y="1326" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600" fill="#1f4e5a">About</text>
</svg>
